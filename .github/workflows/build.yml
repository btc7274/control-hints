name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  ROJO_VERSION: "7.7.0"
  MODEL_NAME: control-hints-creator-store-model.rbxm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo
        run: |
          curl -sSL -o rojo.zip \
            "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip -q rojo.zip
          chmod +x rojo
          ./rojo --version

      - name: Build model
        run: ./rojo build --output "${MODEL_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-hints-model
          path: ${{ env.MODEL_NAME }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Control Hints ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${MODEL_NAME}" \
          || gh release upload "${GITHUB_REF_NAME}" "${MODEL_NAME}" --clobber
